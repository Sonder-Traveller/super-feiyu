# super-feiyu 配置示例（出厂模板）
#
# 本文件是**出厂模板**：复制为 config.toml 后再按自己的环境填写。
# 实际运行的配置在 config.toml（该文件被 gitignore，不入库）。
#
# 密钥全部走 ${ENV_VAR} 引用，不要写明文。变量放在 .env.local / .env 里，
# 或由 systemd unit 的 Environment= 注入。

[log]
level = "info"          # debug | info | warn | error

# ══════════ 通道（至少启用一个）══════════

# QQ 官方机器人：零封号风险，但受被动回复配额限制
[channel.qq_official]
enabled = false
app_id = "${QQ_APP_ID}"
app_secret = "${QQ_APP_SECRET}"

# QQ 小号：走 OneBot v11（NapCat / Lagrange / LLOneBot）
# 能用真实 QQ 号收发，无官方配额，但有封号风险，务必用小号
[channel.qq_onebot]
enabled = false
ws_url = "ws://127.0.0.1:3001"          # OneBot 的 WS 地址
http_url = "http://127.0.0.1:3000"      # OneBot 的 HTTP API 地址（与 WS 端口通常不同）
self_id = "${BOT_QQ}"                   # 机器人 QQ 号，用于判定是否被 @
access_token = "${ONEBOT_TOKEN}"        # 可选

# 微信 iLink：仅单聊、仅文本
[channel.wechat]
enabled = false
bot_token = "${WECHAT_BOT_TOKEN}"

# ══════════ 能力（换厂商只改 provider/base_url/model）══════════
#
# 下面每个能力段只列**真托管 DeepSeek 的厂商**：底层模型锁死 DeepSeek，
# 列一家不托管 DeepSeek 的云，用户选了也只会拿到别的模型，
# 等于绕过了锁定，所以干脆不列。

# ── 对话 ──
# provider 清单：deepseek（官方 key）| workbuddy（本机桥接层，扫码登录）
# 想把 WorkBuddy 桥接层接进来：provider="workbuddy"，
# base_url 指向桥接层的 OpenAI 兼容端点。
[capability.chat]
provider = "deepseek"
base_url = "https://api.deepseek.com"
api_key = "${DEEPSEEK_API_KEY}"
model = "deepseek-flash"
# max_tokens / temperature 不设：写死等于替上游设一个它没要求的限制。
# 不写这两个键 = 不发这两个字段 = 用上游默认值。
# 思考强度锁死 high（产品要求），控制面也拒绝修改。
reasoning_effort = "high"
# DeepSeek 服务端联网工具（deepseek_web_search / deepseek_read_url）。
# 默认开启。仅当对话提供方是 DeepSeek 官方端点时真正生效；此时本地
# web_search/web_fetch 不再注册，搜索由服务端执行（按次计费）。
# 接 WorkBuddy 桥接层时本项无效，本地搜索照常工作。
deepseek_web_tools = true
timeout_ms = 30000

# ── WorkBuddy 桥接 ──
# 只有 provider 用 workbuddy（本机桥接）时才相关。
#
# GUI「登录 WorkBuddy」把凭据写进 cred_file；桥接层用 --cred-file 读它，
# 或用 --control-url 通过 HTTP 从控制面拉（跨平台部署必须用后者：
# 控制面在 WSL、桥在 Windows 时，两边看到的不是同一个文件）。
[capability.workbuddy]
# 凭据落盘路径。留空 = data/workbuddy.json（相对 config.toml 所在目录）。
# 跨平台时填桥接层那边能读到的路径，例如：
#   /mnt/c/Users/Assistant/projects/super-feiyu/data/workbuddy.json
cred_file = ""
# 桥接层拉凭据用的独立令牌（不是 FEIYU_API_TOKEN）。
# 留空 = 自动生成到 data/control_credential_token.txt（权限 600）。
# 按密钥处理：这里写 "${VAR}" 引用 .env.local 里的变量。
credential_token = ""

# ── 向量 ──
# provider 清单：ark | dashscope | qianfan | siliconflow | workbuddy
# DeepSeek 官方没有向量接口，所以不在清单里。
# 免费选项：siliconflow 的 BAAI/bge-m3（需实名）
[capability.embedding]
provider = "siliconflow"
base_url = "https://api.siliconflow.cn/v1"
api_key = "${SILICONFLOW_API_KEY}"
model = "BAAI/bge-m3"
dimension = 1024
# 请求路径，空 = /embeddings
path = ""
# 输出维度字段名：留空 = 不发（默认）。
#
# 多数模型的维度固定，多传这个字段会被拒——实测硅基流动的 bge-m3
# 收到 dimensions 直接返回 20015 invalid。
# 只在模型明确支持 Matryoshka 截断时才填。
dimensions_field = ""
# 额外固定字段，JSON 原样合并进请求体，一般留空
extra_json = ""
timeout_ms = 20000

# ── 语音识别 ──
# provider 清单：dashscope | deepseek | siliconflow | volcengine
#
# 收到的语音先按文件头嗅探真实格式（QQ 发 SILK，微信发 AMR/SILK），
# 需要时自动转 16k 单声道 WAV。云端一律走 multipart 上传。
[capability.stt]
provider = "siliconflow"
base_url = "https://api.siliconflow.cn/v1"
api_key = "${SILICONFLOW_API_KEY}"
model = "FunAudioLLM/SenseVoiceSmall"
# auto = 自动识别语种（多数厂商不发这个字段）
language = "auto"
# 端点路径，空 = 按 provider 用默认值
path = ""
# 强制转 16k 单声道 WAV（百度需要）
need_wav16k = false
# 上传大小上限，0 = 不限（DeepSeek 是 8388608）
max_upload_bytes = 0
timeout_ms = 30000

# ── 语音合成 ──
# provider 清单：dashscope | deepseek | edge | siliconflow | volcengine
# edge 无需 key，但依赖系统装有 edge-tts。
[capability.tts]
provider = "edge"
base_url = ""
api_key = ""
# HTTP 类厂商用；edge 用 voice 字段
model = ""
# 音色：edge 用微软音色名，火山用音色 ID
voice = "zh-CN-XiaoyiNeural"
# 输出格式：mp3 / wav / ogg（火山 v1 支持 mp3 ogg_opus pcm wav）
format = "mp3"
# 端点路径，空 = 按 provider 用默认值
path = ""
# 火山专用：appid 与 cluster
app_id = ""
cluster = ""
# 额外参数直通（火山可覆盖 audio 段的 speed_ratio / volume_ratio 等）
# 例：{"audio":{"speed_ratio":1.1,"volume_ratio":1.2}}
extra_json = ""
timeout_ms = 20000

# ── 文档输入 ──
# provider 清单：deepseek | none
#
# 对方发来 PDF / Word / PPT / 图片 / 表格时自动解析，内容进上下文。
# 单独一层：文档有自己的失败模式（页数超限、加密、解析超时）
# 和成本模型（按页计费），不和模型能力混在一起。
#
#   deepseek —— Files API（POST /files），上传时完成解析，拿回 file_id，
#               后续轮次只传 id；图片走 rich_layout_recognition 时模型能看到图表
#   none     —— 不启用（收到文件时模型只看到「收到一个文件」）
#
# 纯文本（txt/md/csv/json/代码）本地直读，不上传、不计费。
[capability.document]
provider = "none"
base_url = "https://api.deepseek.com"
api_key = "${DEEPSEEK_API_KEY}"
timeout_ms = 180000
# 单文件大小上限，0 = 不限制
max_bytes = 104857600

# ── 网络搜索 ──
# provider 清单：bocha | brave | deepseek | exa | generic | google | jina
#                | none | searxng | serper | tavily | zhipu
#
# 聚合成一层：provider 选哪家协议，换一家只改这里。
# 各家字段差异（url vs link、title vs name）已在实现里适配。
#
# ── 启用条件（两条都要满足，缺一条搜索就没开）────────────
#   1. provider != "none"    —— 决定用哪家的协议
#   2. api_key 解析出非空值  —— 没 key 就不注册 web_search/web_fetch
#
# api_key 写 "${DEEPSEEK_API_KEY}" 时，这把 key 从 .env.local 读。
# **没填 = 搜索不启用**。但「没填」不会静默，三处都会说：
#   - 启动日志：warn / config / env_var_missing / var=DEEPSEEK_API_KEY
#   - 控制面：GET /v1/config 的 capability.search.key_ready = false
#   - GUI：「模型」页的搜索 API Key 输入框会出现，填进去保存即生效
#
# 填 key 的两种方式（等价）：
#   1. 直接编辑 .env.local，加一行 DEEPSEEK_API_KEY=sk-xxx
#   2. GUI「模型」页 → 搜索提供方选 DeepSeek 官方 → 填 API Key → 保存
#      （控制面把 key 写进 .env.local，config.toml 里保持 ${DEEPSEEK_API_KEY}）
#
# ⚠ 与服务端联网工具的互斥关系：
#   对话提供方是 DeepSeek 官方端点且 capability.chat.deepseek_web_tools
#   开启时，本地 web_search/web_fetch **不注册**——搜索由服务端执行
#   （deepseek_web_search / deepseek_read_url，边思考边搜，按次计费）。
#   端点不是官方（如 WorkBuddy 桥接）时，开关无效，搜索照常走本地。
[capability.search]
provider = "deepseek"
# 空 = 按 provider 用官方默认地址
base_url = "https://api.deepseek.com"
# 请求路径，空 = 按 provider 用默认值
path = ""
api_key = "${DEEPSEEK_API_KEY}"
# generic 专用：需要额外标识时填（如 Google cx / 智谱 search_engine）
api_engine = ""
max_results = 5
timeout_ms = 15000

# search：是否在结果里带网页正文（更全但更慢/更大）
need_content = false
# fetch：给模型看的正文上限（超长页面会截断，防撑爆上下文）
fetch_max_chars = 6000

# 以下仅 generic 直连模式使用
# 是否允许访问内网地址（默认 false，SSRF 防护）
allow_private_hosts = false
fetch_max_bytes = 2097152

# ── 生图 ──
# provider 清单：bridge | openai | siliconflow
# 默认关闭：只用形象库库存图（生图后端待定）。
[capability.image]
provider = "none"
base_url = ""
api_key = ""
model = ""
default_size = "1024x1024"

# ══════════ 记忆（三层）══════════

[memory]
# ── 上下文预算（按百分比，不按固定轮数）──
# 模型上下文窗口大小。填你实际用的模型，用于算预算。
model_context_tokens = 131072

# 原始对话（buffer）可占窗口的比例：预算内有几条给几条，一条不省。
# 硬上限 50%（TokenBudget::kRawBufferMaxRatio）：写更高也按 50% 算。
raw_context_ratio = 0.40

# 超预算时，把最早的对话压成摘要；摘要可占余下空间的比例。
summary_ratio = 0.25

# 存储不设上限：超出上下文预算的原文全部落盘（data/memory/notes/），
# 并按向量建索引，供模型用工具检索。

notes_dir = "data/memory/notes"    # 旁路文件（权威源，人可读、可手改）
db_path = "data/memory/index.db"   # SQLite 索引（可随时从文件重建）
portraits_dir = "data/memory/portraits"   # 形象库：放你自己的图，manifest.md 可手改
media_dir = "data/memory/media"           # 媒体缓存：入站/出站的图片语音落本地副本

# ══════════ 上游能力探测 ══════════
# 不用配置开关：启动时真实探测上游支持哪些特性，结果写盘缓存。
# 上游会静默变更行为（如 WorkBuddy 在 HTTP 200 下丢弃 assistant 图片），
# 靠人工配置必然过时，所以自动探测。
[probe]
cache_path = "data/probe/capabilities.json"
ttl_days = 30          # 缓存有效期，过期自动重探
on_start = true        # 启动时同步探测（false = 只用缓存，后台再探）

# ══════════ 工具调用 ══════════
# 模型可主动调用的工具：search_memory / search_images / web_search / web_fetch
# web_search / web_fetch 需要**两个条件同时满足**才注册：
#   capability.search.provider != "none" 且该能力的 api_key 解析出非空值
# 另外：对 DeepSeek 官方端点开了 capability.chat.deepseek_web_tools 时，
# 本地 web_search / web_fetch 不注册（改由服务端执行搜索）。
[tool]
max_rounds = 0         # 单轮最多几次工具调用；0 = 不限制，由模型自己决定何时停

# ══════════ 安全防护 ══════════
[guard]
max_input_bytes = 0        # 单条消息上限；0 = 不限制
detect_injection = true    # 检测提示注入
reject_injection = true    # true=直接拒绝，false=保留但加防护
max_output_bytes = 0       # 单条回复上限；0 = 不限制
redact_secrets = true      # 脱敏 API key / token
strip_links = true         # 去链接（QQ 会因链接拒绝整条消息）
rate_limit = 12            # 窗口内最多几条
rate_window_s = 60         # 窗口长度（秒）

[dispatcher]
# 工作线程数。0 = 自动（核数，上限 4，至少 2；2 核机器即 2 线程）。
# 任务以等模型和网络为主，线程开太多没收益。
threads = 0

[orchestrator]
max_replies = 4                # 单条入站最多回几条（QQ 官方：单聊 4 / 群 5）
passive_window_ms = 300000     # 被动回复窗口；超过 80% 放弃，避免白发

[persona]
# 人格文件：首次启动会播种到 data/persona/default.md，
# 之后直接改那个文件即可（热加载，不用重启）。
persona_file = "persona/persona.md"
# 人格存储目录
store_dir = "data/persona"
# rules_file 是可选的，不配就只有人格文件
# rules_file = "persona/rules.md"

# ── 控制面 API ──
# 只暴露 HTTP API，不带界面，供另一个进程（GUI）管理人格与通道。
#
# 鉴权：token 从环境变量 FEIYU_API_TOKEN 读，不写在这里。
# 开着鉴权又没设 token 时，服务不会启动（不会静默降级成无鉴权）。
#
# 端点：
#   GET    /healthz                          探活（免鉴权）
#   GET    /v1/config                        读当前生效配置
#   PUT    /v1/config                        部分更新配置
#   GET    /v1/conversations                 会话登记表（GUI 卡片列表的数据源）
#   GET    /v1/persona/default               读全局默认人格
#   PUT    /v1/persona/default               写全局默认  {"persona":"..."}
#   GET    /v1/persona/session?conv_id=X     读某会话人格
#   PUT    /v1/persona/session?conv_id=X     设某会话人格 {"persona":"..."}
#   DELETE /v1/persona/session?conv_id=X     清除会话覆盖
#   POST   /v1/capability/workbuddy/login        发起 WorkBuddy 扫码登录
#   GET    /v1/capability/workbuddy/login/status 查登录状态
#   POST   /v1/capability/workbuddy/test         测桥接层连通性
#   GET    /v1/capability/workbuddy/credential   取 WorkBuddy 凭据（明文）
#
# 凭据端点（credential）返回明文 access_token，只认**凭据专用令牌**
# （capability.workbuddy.credential_token）。主令牌也能过，但桥接层
# 应该用专用令牌——主令牌能改配置、扫码登录，权限太大。
[api]
port = 0                 # 0 = 不启动
bind = "127.0.0.1"       # 只监听本机；要对外改成 0.0.0.0 并自己加防火墙
auth = true              # 必须配合 FEIYU_API_TOKEN 使用
